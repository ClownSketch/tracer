name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 代码质量与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true

      - name: 验证依赖
        run: go mod verify

      - name: 静态检查
        run: go vet ./...

      - name: 运行默认测试
        run: go test -count=1 ./...

      - name: 运行 Hook 构建标签测试
        run: go test -count=1 -tags "http_hook redis_hook gorm_hook sqlx_hook" ./...

  race:
    name: 数据竞争检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true

      - name: 运行 Race 测试
        run: go test -race -count=1 ./...

  mongodb:
    name: MongoDB 真库回归
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true

      - name: 运行 MongoDB v1、v2 与 WAL 回归
        env:
          MONGO_URI: mongodb://127.0.0.1:27017
          TRACER_E2E_MONGO_DATABASE: tracer_ci
          TRACER_E2E_REQUESTS: "2048"
          TRACER_E2E_CONCURRENCY: "64"
        run: >-
          go test ./integration
          -run 'TestMongoDBExporter_(FullFlowE2E|WALFullFlowE2E|EventAttributesSchemaE2E)|TestMongoDBV2Exporter_EventAttributesSchemaE2E'
          -count=1 -v

  vulnerability:
    name: 依赖漏洞检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true

      - name: 运行 govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
